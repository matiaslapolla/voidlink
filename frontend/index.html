<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voidlink</title>
    <script>
      // Apply the saved theme before first paint, so frame one is the palette
      // the user chose rather than default dark.
      //
      // This has to do BOTH things `store/theme.ts#applyTheme` does — the mode
      // class *and* `data-theme` — because eight of the ten themes are selected
      // purely by the attribute. Setting only the class used to paint the first
      // frame in default dark/light for all eight, and worse: `github-light`
      // and `solarized-light` are light themes that are not the string
      // "light", so they got `.dark` and inverted until Solid booted.
      //
      // LIGHT_THEMES must match `LIGHT_THEME_IDS` in
      // `frontend/src/store/themeTable.ts` — the `mode: "light"` entries of the
      // theme table. It cannot import them (this runs before any module), so it
      // is duplicated here and nowhere else, and
      // `src/store/themeTable.test.ts` parses this very array out of this file
      // and asserts the two are equal. Edit one without the other and that test
      // goes red; it is not a comment asking you to remember.
      try {
        var LIGHT_THEMES = ["light", "github-light", "solarized-light"];
        var t = localStorage.getItem("voidlink-theme") || "dark";
        var root = document.documentElement;
        root.classList.add(LIGHT_THEMES.indexOf(t) === -1 ? "dark" : "light");
        // The default pair carry no attribute: they are `:root` / `:root.light`.
        if (t !== "dark" && t !== "light") root.setAttribute("data-theme", t);
      } catch(e) { document.documentElement.classList.add("dark"); }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
