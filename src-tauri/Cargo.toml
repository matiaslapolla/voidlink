[package]
name = "voidlink"
version = "0.1.0"
description = "VoidLink - Desktop tool suite"
authors = ["VoidLink Contributors"]
license = "MIT"
repository = ""
edition = "2021"
# Floor is set by `keyring` 4.x (MSRV 1.88.0), the OS credential store used for
# AI provider keys. Everything else in the tree builds on 1.77.
rust-version = "1.88"

[lib]
name = "voidlink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# Pinned to an exact version on purpose: `unstable` gates the multiwebview API
# (browser tabs are child webviews), and unstable APIs are allowed to break
# across patch/minor releases. A caret range would let that happen silently.
# `devtools` is what makes `open_devtools` compile in release too — the
# embedded browser exposes an inspector button in every build, and gating it on
# `debug_assertions` would make that button a no-op in the shipped app.
tauri = { version = "=2.11.2", features = ["unstable", "devtools", "protocol-asset"] }
# Re-exported by tauri, but depended on directly: `Webview::navigate` takes a
# `Url`, and parsing at the command boundary is what rejects a malformed
# address before a webview is built around it.
url = "2"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.7"
tauri-plugin-fs = "2.5"
portable-pty = "0.8"
uuid = { version = "1", features = ["v4"] }
git2 = { version = "0.19", features = ["vendored-libgit2"] }
dashmap = "6.1.0"
ignore = "0.4"
# Stack submit (Wave D) uses the blocking client so the existing
# spawn_blocking wrapper in command handlers is sufficient — no Tokio runtime
# tangled into GitHub HTTP calls. rustls keeps us off OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# OS credential store for AI provider keys. Default `v1` feature wires the
# native backends: macOS Keychain, Windows Credential Manager, Linux
# secret-service. Deliberately NOT a self-rolled vault or tauri-plugin-stronghold
# — the point is that the key lives where the OS already guards credentials.
keyring = "4.1"
notify-debouncer-full = "0.7.0"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "wav"] }
tauri-plugin-notification = "2.3.3"
# Remote (SSH/SFTP) file roots. Pure-Rust rather than libssh2/`ssh2-rs` so
# there is no C library to vendor beside the two we already carry, and because
# russh is async — a remote `list_dir` is an `await` on the tokio runtime Tauri
# already runs commands on, not a blocking call needing `spawn_blocking`.
# Versions are the exact pair verified against each other: russh-sftp 2.4
# requires russh >= 0.62.5, and 0.63 is a beta.
russh = "0.62.7"
russh-sftp = "2.4.0"
# `~/.ssh/config` parsing. Named for `ssh2-rs`, but it is a standalone parser —
# it returns resolved `HostParams`, and nothing here links against libssh2.
ssh2-config = "0.7.2"
# Shell quoting for the two remote operations that need a real shell (`cp -a`,
# `rm -rf`). A dependency rather than eight hand-written lines because getting
# the embedded-single-quote case wrong is a command injection, not a typo.
shell-escape = "0.1.5"
# Re-exported by tauri, but depended on directly for the same reason `url` is:
# the remote session supervisor sleeps on a timer and the ssh-agent client
# takes a `UnixStream`, both of which are tokio types this crate names.
tokio = { version = "1.53.1", features = ["net", "io-util", "time", "macros", "rt"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
